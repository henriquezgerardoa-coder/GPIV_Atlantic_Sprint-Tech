server.port=${SERVER_PORT:8090}

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/gpiv}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.api.usuarios.semilla.admin.clave=${SEED_ADMIN_CLAVE:admin12345}
app.api.usuarios.semilla.operador.clave=${SEED_OPERADOR_CLAVE:operador123}
app.api.usuarios.semilla.empresa.clave=${SEED_EMPRESA_CLAVE:empresa12345}
app.api.usuarios.semilla.actualizar-claves-si-existe=${SEED_ACTUALIZAR_CLAVES_SI_EXISTE:true}

