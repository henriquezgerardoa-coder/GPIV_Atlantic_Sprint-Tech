# ─── Perfil Neon (NO VERSIONAR — ver .gitignore) ─────────────────────────────
# Activa con: -Dspring.profiles.active=neon
# o en IntelliJ: Edit Configurations > Active profiles: neon

# Credenciales Neon via env vars (rotar el password en el panel de Neon — estuvo expuesto en git)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# HikariCP — ajustado para Neon serverless (free tier: ~20 conexiones globales)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Silencia SQL en consola para sesiones contra Neon
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Flyway (activo en Neon) ──────────────────────────────────────────────────
# Hibernate no modifica el esquema: Flyway es la única fuente de verdad
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# baseline-version=0 permite que V1 corra incluso en DBs que ya tengan tablas sin historial Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0