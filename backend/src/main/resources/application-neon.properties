# Credenciales Neon
spring.datasource.url=jdbc:postgresql://ep-shy-math-ac52y9a5-pooler.sa-east-1.aws.neon.tech/AST-GPIV-DB?sslmode=require&prepareThreshold=0
spring.datasource.username=neondb_owner
spring.datasource.password=npg_XhHCN3O0Vjyt

# HikariCP — ajustado para Neon serverless (free tier: ~20 conexiones globales)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Silencia SQL en consola para sesiones contra Neon
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Flyway (activo en Neon) ──────────────────────────────────────────────────
# Hibernate no modifica el esquema: Flyway es la única fuente de verdad
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# baseline-version=0 permite que V1 corra incluso en DBs que ya tengan tablas sin historial Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0