# ─── Base de Datos ────────────────────────────────────────────────────────────
# Los valores reales de conexion se inyectan por:
#   - perfil "neon"  → application-neon.properties  (local, gitignoreado)
#   - perfil "dev"   → application-dev.properties   (local Docker, por defecto)
#   - Docker Compose → env vars SPRING_DATASOURCE_* (Docker/CI)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Aplicacion ───────────────────────────────────────────────────────────────
spring.application.name=gestion-gpiv
spring.profiles.default=dev
server.port=8090

# ─── API Usuarios ─────────────────────────────────────────────────────────────
app.api.usuarios.roles-legado.deprecation=${USUARIOS_ROLES_LEGADO_DEPRECATION:true}
app.api.usuarios.roles-legado.sunset=${USUARIOS_ROLES_LEGADO_SUNSET:Thu, 31 Dec 2026 23:59:59 GMT}
app.api.usuarios.roles-legado.link=${USUARIOS_ROLES_LEGADO_LINK:</api/catalogos/roles>; rel="successor-version"}

# ─── Registro Publico ─────────────────────────────────────────────────────────
app.registro.contacto-soporte=${REGISTRO_CONTACTO_SOPORTE:soporte@gpiv.local}
app.registro.token.expiracion-horas=${REGISTRO_TOKEN_EXPIRACION_HORAS:24}
app.registro.mail.habilitado=${REGISTRO_MAIL_HABILITADO:false}
app.registro.mail.remitente=${REGISTRO_MAIL_REMITENTE:no-reply@gpiv.local}
app.registro.limites.max-intentos-registro=${REGISTRO_MAX_INTENTOS:5}
app.registro.limites.max-reenvios-verificacion=${REGISTRO_MAX_REENVIOS:5}
app.registro.limites.max-intentos-ingreso=${INGRESO_MAX_INTENTOS:5}
app.registro.limites.ventana-minutos=${SEGURIDAD_VENTANA_MINUTOS:15}