<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPIV – Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-ingreso min-vh-100 d-flex align-items-center">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-9 col-md-6 col-lg-4">

            <div class="text-center mb-4">
                <i class="bi bi-building-gear text-white" style="font-size: 3.5rem;"></i>
                <h3 class="text-white mt-2 fw-bold">GPIV</h3>
                <p class="text-white-50 mb-0">Gestión Parque Industrial Viedma</p>
            </div>

            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h5 class="text-center text-muted mb-4">Iniciar Sesión</h5>

                    <div id="mensajeError" class="alert alert-danger d-none" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span id="textoError"></span>
                    </div>

                    <form id="formularioIngreso" novalidate>
                        <div class="mb-3">
                            <label for="nombreUsuario" class="form-label fw-semibold">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-person text-muted"></i>
                                </span>
                                <input type="text" class="form-control" id="nombreUsuario"
                                       placeholder="Nombre de usuario" required autofocus autocomplete="username">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="claveAcceso" class="form-label fw-semibold">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-lock text-muted"></i>
                                </span>
                                <input type="password" class="form-control" id="claveAcceso"
                                       placeholder="Contraseña" required autocomplete="current-password">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btnIngresar">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                        </button>
                    </form>
                </div>
            </div>

            <p class="text-center text-white-50 mt-4 small">
                Atlantic Sprint-Tech &copy; 2026
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ingreso.js"></script>
</body>
</html>
