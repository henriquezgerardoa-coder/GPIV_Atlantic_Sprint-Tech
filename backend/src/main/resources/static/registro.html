<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPIV - Registro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-ingreso min-vh-100 d-flex align-items-center">
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h5 class="text-center text-muted mb-4">Crear cuenta</h5>

                    <div id="mensajeRegistro" class="alert d-none" role="alert"></div>

                    <form id="formularioRegistro" novalidate>
                        <div class="mb-3">
                            <label for="correoElectronico" class="form-label fw-semibold">Correo electronico</label>
                            <input type="email" class="form-control" id="correoElectronico" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="clave" class="form-label fw-semibold">Contrasena</label>
                            <input type="password" class="form-control" id="clave" required minlength="8" autocomplete="new-password">
                            <div class="form-text">Minimo 8 caracteres con mayusculas, minusculas y numeros.</div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmacionClave" class="form-label fw-semibold">Confirmar contrasena</label>
                            <input type="password" class="form-control" id="confirmacionClave" required minlength="8" autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="btnRegistrar">
                            <i class="bi bi-person-plus me-2"></i>Registrarme
                        </button>
                    </form>

                    <hr class="my-4">

                    <h6 class="text-muted">No recibiste el correo?</h6>
                    <form id="formularioReenvio" novalidate>
                        <div class="input-group">
                            <input type="email" class="form-control" id="correoReenvio" placeholder="correo@dominio.com" required>
                            <button class="btn btn-outline-secondary" type="submit" id="btnReenviar">Reenviar</button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <a href="/index.html" class="text-decoration-none">Volver a iniciar sesion</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/registro.js"></script>
</body>
</html>
