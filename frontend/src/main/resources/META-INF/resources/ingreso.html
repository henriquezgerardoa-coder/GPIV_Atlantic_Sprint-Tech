<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPIV - Iniciar Sesion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-ingreso min-vh-100 d-flex align-items-center">

<div class="container iframe-form-container">
    <div class="row justify-content-center w-100 m-0">
        <div class="col-12 p-0">

            <div class="text-center mb-4 d-none d-md-block">
                <img src="img/logo.png" alt="Logo ENREPAVI" class="img-fluid mb-2" style="max-height: 200px;">
                <p class="text-white-50 mb-3 fs-5">Ente para la Reconversión del Parque Industial de Viedma</p>
            </div>

            <div class="card border-0">
                <div class="card-body">
                    <h5 class="text-center text-muted mb-4">Iniciar Sesión</h5>

                    <div id="mensajeContexto" class="alert d-none" role="status" aria-live="polite"></div>

                    <div id="mensajeError" class="alert alert-danger d-none" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span id="textoError"></span>
                    </div>

                    <form id="formularioIngreso" novalidate>
                        <div class="mb-3">
                            <label for="nombreUsuario" class="form-label fw-semibold">Usuario o correo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-person text-muted"></i>
                                </span>
                                <input type="text" class="form-control" id="nombreUsuario"
                                       placeholder="usuario o correo@dominio.com" required autofocus autocomplete="username">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="claveAccesso" class="form-label fw-semibold">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-lock text-muted"></i>
                                </span>
                                <input type="password" class="form-control" id="claveAcceso"
                                       placeholder="Contrasena" required autocomplete="current-password">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btnIngresar">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                        </button>

                        <div class="text-center mt-3">
                            <a href="/registro.html" class="text-decoration-none">No tienes cuenta? Registrate</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<footer class="footer-auth mt-4 d-none d-md-block">
    <div class="footer-auth__info">
        <span><i class="bi bi-geo-alt-fill"></i> Ruta 1 S/N Ex Tomatera, Viedma, Río Negro</span>
        <span><i class="bi bi-telephone-fill"></i> (02920) 433087</span>
    </div>
    <div class="footer-auth__redes">
        <a href="https://www.instagram.com/enrepavi?igsh=MWVoZm5ha3c2NHRkZQ==" target="_blank" rel="noopener" aria-label="Instagram ENREPAVI">
            <i class="bi bi-instagram"></i>
        </a>
        <a href="https://www.facebook.com/share/1avtMJBanM/" target="_blank" rel="noopener" aria-label="Facebook ENREPAVI">
            <i class="bi bi-facebook"></i>
        </a>
    </div>
</footer>

<p class="text-center text-white-50 mt-2 mb-3 small d-none d-md-block">
    Atlantic Sprint-Tech &copy; 2026
</p>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/credenciales.js"></script>
<script src="js/ingreso.js"></script>
</body>
</html>
